<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Coins falling into a bowl with a spoon">
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fbf71"/>
      <stop offset="1" stop-color="#0f6b3d"/>
    </linearGradient>
    <linearGradient id="bowlside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="1" stop-color="#f0a92e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fb0bc"/>
    </linearGradient>
    <!-- face-on coin -->
    <g id="coin">
      <circle r="11" fill="url(#gold)" stroke="#c98a1a" stroke-width="1.5"/>
      <circle r="7" fill="none" stroke="#d9942a" stroke-width="1.5"/>
      <path d="M-7-5a9 9 0 0 1 6-4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    </g>
    <!-- tilted coin with visible thickness -->
    <g id="tilt">
      <ellipse cy="2.5" rx="11" ry="7" fill="#c98a1a"/>
      <ellipse rx="11" ry="7" fill="url(#gold)" stroke="#c98a1a" stroke-width="1.2"/>
      <ellipse rx="7" ry="4.2" fill="none" stroke="#d9942a" stroke-width="1.2"/>
    </g>
    <!-- one-piece spoon: oval head, tapered neck, flared handle end -->
    <path id="spoon" transform="translate(62 68) rotate(-37)"
          d="M9-4.3C13-3 14-1.8 18-1.8L62-2.4Q70-2.4 70 0Q70 2.4 62 2.4L18 1.8C14 1.8 13 3 9 4.3A11 7.5 0 1 1 9-4.3Z"/>
    <!-- keeps the lip stroke inside the bowl outline -->
    <clipPath id="bowlclip">
      <path d="M16 74a48 7 0 0 1 96 0a48 36 0 0 1-96 0z"/>
    </clipPath>
    <clipPath id="pile">
      <path d="M16 74a48 8 0 0 0 96 0V20H16z"/>
    </clipPath>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="64" cy="113" rx="34" ry="4.5" fill="#000" opacity="0.14"/>
  <!-- bowl -->
  <path d="M16 74h96a48 36 0 0 1-96 0z" fill="url(#bowl)"/>
  <path d="M16 74h96a48 36 0 0 1-96 0z" fill="url(#bowlside)"/>
  <!-- inner back rim -->
  <path d="M16 74a48 7 0 0 1 96 0z" fill="#0b5530"/>
  <!-- coins that have landed, back to front -->
  <g clip-path="url(#pile)">
    <use href="#tilt" transform="translate(44 60) rotate(25)"/>
    <use href="#tilt" transform="translate(86 60) rotate(-20)"/>
    <use href="#coin" transform="translate(65 58) rotate(-18)"/>
    <use href="#tilt" transform="translate(30 68) rotate(-10)"/>
    <use href="#coin" transform="translate(52 67) rotate(35)"/>
    <use href="#coin" transform="translate(97 68) rotate(12)"/>
    <use href="#tilt" transform="translate(40 73) rotate(15)"/>
    <use href="#tilt" transform="translate(70 74) rotate(-15)"/>
    <use href="#tilt" transform="translate(88 75) rotate(20)"/>
  </g>
  <!-- falling coins with motion streaks -->
  <g stroke="#fff" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M41 7.5l-1.5 7.5" stroke-width="1.6"/>
    <path d="M66.5 1.5l-.8 5" stroke-width="1.3"/>
    <path d="M92 17l-1 8" stroke-width="1.8"/>
  </g>
  <use href="#tilt" transform="translate(40 26) rotate(-25)"/>
  <use href="#tilt" transform="translate(66 14) rotate(30)"/>
  <use href="#tilt" transform="translate(91 36) rotate(-10)"/>
  <!-- spoon -->
  <use href="#spoon" fill="#6b7c88" opacity="0.5" transform="translate(0 1.5)"/>
  <use href="#spoon" fill="url(#silver)" stroke="#8a9ba7" stroke-width="1" stroke-linejoin="round"/>
  <g transform="translate(62 68) rotate(-37)">
    <ellipse rx="7" ry="4.5" fill="#b4c2cc"/>
    <ellipse cx="-1" cy="-1" rx="5" ry="2.8" fill="#dbe4ea" opacity="0.8"/>
    <path d="M18-0.6L41-0.9M46-0.8L64-0.7" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- coin just in front of the spoon head -->
  <g clip-path="url(#pile)">
    <use href="#tilt" transform="translate(50 74) rotate(15)"/>
  </g>
  <!-- front lip -->
  <!-- one continuous shape that tapers from thick (left) to thin (right) -->
  <path clip-path="url(#bowlclip)" fill="#5fe0a0"
        d="M14 71.3C20 79.3 40 81.5 62 81.3C84 81 106 78.4 114 71.7L114 73.3C106 80 84 82.9 62 83.3C40 83.7 20 81.7 14 73.7Z"/>
  <!-- bowl highlight -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity="0.28">
    <path d="M25 85C28 92 32 96 38 99" stroke-width="3.2"/>
    <path d="M42 102l4 1.5" stroke-width="2"/>
  </g>
</svg>
