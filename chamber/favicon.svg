<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800">
  <title>Ishtar star</title>
  <defs>
    <path id="back-star" d="M 400 70 L 485 315 L 730 400 L 485 485 L 400 730 L 315 485 L 70 400 L 315 315 Z" />
    <path id="front-star" d="M 400 20 L 485 315 L 780 400 L 485 485 L 400 780 L 315 485 L 20 400 L 315 315 Z" />
    <polygon id="back-shade" points="400,70 485,315 400,400" />
    <polygon id="front-shade" points="400,20 485,315 400,400" />
  </defs>

  <!-- back star, rotated 45 degrees -->
  <g transform="rotate(45 400 400)">
    <use xlink:href="#back-star" fill="#c99700" />
    <g fill="#a67c00">
      <use xlink:href="#back-shade" />
      <use xlink:href="#back-shade" transform="rotate(90 400 400)" />
      <use xlink:href="#back-shade" transform="rotate(180 400 400)" />
      <use xlink:href="#back-shade" transform="rotate(270 400 400)" />
    </g>
    <use xlink:href="#back-star" fill="none" stroke="#000000" stroke-width="20" stroke-linejoin="round" />
  </g>

  <!-- front star -->
  <use xlink:href="#front-star" fill="#ffd700" />
  <g fill="#e6b800">
    <use xlink:href="#front-shade" />
    <use xlink:href="#front-shade" transform="rotate(90 400 400)" />
    <use xlink:href="#front-shade" transform="rotate(180 400 400)" />
    <use xlink:href="#front-shade" transform="rotate(270 400 400)" />
  </g>
  <use xlink:href="#front-star" fill="none" stroke="#000000" stroke-width="20" stroke-linejoin="round" />

  <!-- facet lines -->
  <g stroke="#000000" stroke-width="8" stroke-linecap="round">
    <path d="M 400 50 V 750 M 50 400 H 750" />
    <path d="M 188 188 L 612 612 M 612 188 L 188 612" />
  </g>

  <circle cx="400" cy="400" r="42" fill="#000000" />
  <circle cx="400" cy="400" r="18" fill="#ffd700" />
</svg>
